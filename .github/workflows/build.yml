name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Tests unitaires (simulateur iPhone 16)
        run: |
          set -o pipefail
          xcodebuild test \
            -project AutoClicker.xcodeproj \
            -scheme AutoClicker \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)"

      - name: Compiler pour iPhone (non signé)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AutoClicker.xcodeproj \
            -target AutoClicker \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 20

      - name: Créer AutoClicker.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AutoClicker.app Payload/
          zip -qr AutoClicker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-ipa
          path: AutoClicker.ipa
